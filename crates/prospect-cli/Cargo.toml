[package]
name = "prospect-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for ProspectEngine evidence and campaign operations"

[[bin]]
name = "prospect"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
prospect-adapter = { path = "../prospect-adapter" }
prospect-bundle = { path = "../prospect-bundle" }
prospect-dispatch = { path = "../prospect-dispatch" }
prospect-kv-position-campaign = { path = "../prospect-kv-position-campaign" }
prospect-kv-position-observed = { path = "../prospect-kv-position-observed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
