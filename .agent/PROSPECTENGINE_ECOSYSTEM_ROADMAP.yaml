ax_task_program:
  external_reference: google_ax_architecture_only
  objective: >-
    Bind scenario evaluation and admissible-intervention analysis to exact task
    inputs, explicit resource envelopes and immutable evidence outputs.
  phases:
    - AXPE1_pin_adapter_scenario_catalog_and_upstream_contract_identity
    - AXPE2_attach_resource_and_time_envelopes_to_scenario_evaluation
