[workspace]
resolver = "2"
members = [
    "crates/prospect-core",
    "crates/prospect-scenario",
    "crates/prospect-evidence",
    "crates/prospect-tdi",
    "crates/prospect-elastic",
    "crates/prospect-flat",
    "crates/prospect-kv",
    "crates/prospect-kv-observed",
    "crates/prospect-kv-selection",
    "crates/prospect-kv-selection-observed",
    "crates/prospect-kv-position",
    "crates/prospect-kv-position-observed",
    "crates/prospect-kv-position-campaign",
    "crates/prospect-cli",
    "crates/prospect-adapter",
    "crates/prospect-registry",
    "crates/prospect-bundle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Tarek Zekriti"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/Memorithm/ProspectEngine"

[workspace.lints.rust]
unsafe_code = "forbid"
