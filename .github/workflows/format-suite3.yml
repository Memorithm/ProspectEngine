name: Format commercial acquisition suite

on:
  push:
    branches: [feat/commercial-acquisition-suite-3]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-3

      - name: Install Rust 1.89 formatter
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt

      - name: Format and commit exact output
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.89.0 fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/prospect-commercial-advanced/src
          git commit -m "style(commercial): apply rustfmt to acquisition suite"
          git push origin HEAD:feat/commercial-acquisition-suite-3
