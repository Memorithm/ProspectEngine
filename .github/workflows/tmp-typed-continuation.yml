name: Prepare typed continuation run
on:
  push:
    branches:
      - feat/typed-continuation-run
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Apply continuation integration
        run: python3 .ci/tmp_prepare_continuation_v8.py
      - name: Validate continuation implementation
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit validated continuation
        run: |
          git rm .github/workflows/tmp-typed-continuation.yml .ci/tmp_prepare_continuation.py .ci/tmp_prepare_continuation_v2.py .ci/tmp_prepare_continuation_v3.py .ci/tmp_prepare_continuation_v4.py .ci/tmp_prepare_continuation_v5.py .ci/tmp_prepare_continuation_v6.py .ci/tmp_prepare_continuation_v7.py .ci/tmp_prepare_continuation_v8.py
          git add crates/prospect-dispatch/src/execution/record/journal/recovery.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/tests.rs
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat: integrate typed parent-linked continuation run'
          git push origin HEAD:refs/heads/feat/typed-continuation-run
