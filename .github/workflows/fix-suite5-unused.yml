name: Fix suite 5 unused variable

on:
  push:
    branches:
      - feat/commercial-acquisition-suite-5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-5
      - shell: bash
        run: |
          set -euo pipefail
          sed -i '/let coefficient = coefficients\[position\];/d' crates/prospect-commercial-advanced/src/constraint_propagation.rs
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/prospect-commercial-advanced/src/constraint_propagation.rs
          git commit -m "fix(commercial): remove unused propagation binding"
          git push origin HEAD:feat/commercial-acquisition-suite-5
