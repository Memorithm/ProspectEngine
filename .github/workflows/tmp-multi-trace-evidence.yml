name: Prepare multi-trace score evidence
on:
  push:
    branches:
      - feat/multi-trace-score-evidence
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Import merged multi-trace module and wire evidence
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:crates/prospect-scenario/src/multi_trace.rs > crates/prospect-scenario/src/multi_trace.rs
          python3 .github/scripts/wire_multi_trace_evidence.py
      - name: Validate raw matrix evidence and workspace
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit validated source only
        run: |
          git rm -f .github/workflows/tmp-multi-trace-evidence.yml .github/scripts/wire_multi_trace_evidence.py
          git add crates/prospect-evidence/src/canonical.rs
          git add crates/prospect-evidence/src/constrained.rs
          git add crates/prospect-evidence/src/lib.rs
          git add crates/prospect-evidence/src/multi_trace.rs
          git add crates/prospect-scenario/src/lib.rs
          git add crates/prospect-scenario/src/multi_trace.rs
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat(evidence): add canonical raw multi-trace score records'
          git push origin HEAD:refs/heads/feat/multi-trace-score-evidence
