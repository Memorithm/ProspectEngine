name: Prepare Pareto dominance witnesses
on:
  push:
    branches:
      - feat/pareto-dominance-witnesses
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Apply dominance witness implementation
        run: python3 .github/scripts/add_pareto_witnesses.py
      - name: Validate decision witnesses and workspace
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit validated source only
        run: |
          git rm -f .github/workflows/tmp-pareto-witnesses.yml .github/scripts/add_pareto_witnesses.py
          git add crates/prospect-scenario/src/decision.rs
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat(scenario): expose Pareto dominance witnesses'
          git push origin HEAD:refs/heads/feat/pareto-dominance-witnesses
