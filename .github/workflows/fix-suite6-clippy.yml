name: Fix commercial acquisition suite 6 lints

on:
  push:
    branches:
      - feat/commercial-acquisition-suite-6

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-6
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/prospect-commercial-advanced/src/cp_global.rs')
          s = p.read_text()
          s = s.replace('    let mut mandatory_peak_load = 0_i64;\n', '', 1)
          s = s.replace('        mandatory_peak_load = profile.values().copied().max().unwrap_or(0);', '        let mandatory_peak_load = profile.values().copied().max().unwrap_or(0);', 1)
          s = s.replace('    mandatory_peak_load = final_profile.values().copied().max().unwrap_or(0);', '    let mandatory_peak_load = final_profile.values().copied().max().unwrap_or(0);', 1)
          p.write_text(s)

          p = Path('crates/prospect-commercial-advanced/src/state_space.rs')
          s = p.read_text()
          old = '        let mut trend = self.trend;'
          if old not in s:
              raise SystemExit('state-space lint fragment not found')
          p.write_text(s.replace(old, '        let trend = self.trend;', 1))
          PY
          cargo +1.89.0 fmt --all
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/prospect-commercial-advanced/src/cp_global.rs crates/prospect-commercial-advanced/src/state_space.rs
          git commit -m "fix(commercial): satisfy strict wave-six lints"
          git push origin HEAD:feat/commercial-acquisition-suite-6
