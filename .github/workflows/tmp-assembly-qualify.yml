name: Prepare verified continuation assembly
on:
  push:
    branches:
      - feat/verified-continuation-assembly
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Wire assembly module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/prospect-dispatch/src/execution/record/journal/recovery/continuation.rs')
          s = p.read_text()
          anchor = 'use prospect_bundle::ScenarioBundle;'
          if s.count(anchor) != 1 or 'pub mod assembly;' in s:
              raise SystemExit('continuation assembly module anchor drift')
          p.write_text(s.replace(anchor, 'pub mod assembly;\n\n' + anchor, 1))
          PY
      - name: Validate assembly and entire workspace
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit validated source only
        run: |
          git rm -f .github/workflows/tmp-assembly-qualify.yml
          git add crates/prospect-scenario/src/lib.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly/tests.rs
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat: integrate verified parent-child batch assembly'
          git push origin HEAD:refs/heads/feat/verified-continuation-assembly
