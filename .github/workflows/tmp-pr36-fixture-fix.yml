name: Temporary PR36 cleanup

on:
  push:
    branches:
      - feature/kv-campaign-suite-verification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kv-campaign-suite-verification
      - name: Patch and validate
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup default 1.89.0
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/prospect-cli/src/kv_campaign_suite.rs')
          text = path.read_text()
          replacements = [
              ('use serde_json::{Value, json};', 'use serde_json::json;'),
              ('let evaluation_tokens = vec![200_u64, 201];', 'let evaluation_tokens = (200_u64..208).collect::<Vec<_>>();'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected fixture expression not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/tmp-pr36-fixture-fix.yml
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Commit cleanup
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/prospect-cli/src/kv_campaign_suite.rs .github/workflows/tmp-pr36-fixture-fix.yml
          git commit -m "fix(cli): align KV suite fixture with verifier contract"
          git push origin HEAD:feature/kv-campaign-suite-verification
