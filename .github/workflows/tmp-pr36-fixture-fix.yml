name: Temporary PR36 fixture fix

on:
  push:
    branches:
      - feature/kv-campaign-suite-verification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kv-campaign-suite-verification
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Patch, format and test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/prospect-cli/src/kv_campaign_suite.rs')
          text = path.read_text()
          old = 'let evaluation_tokens = vec![200_u64, 201];'
          new = 'let evaluation_tokens = (200_u64..208).collect::<Vec<_>>();'
          if old not in text:
              raise SystemExit('expected fixture expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup default 1.89.0
          cargo fmt --all
          cargo test -p prospect-cli --bin prospect kv_campaign_suite::tests
      - name: Commit source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/prospect-cli/src/kv_campaign_suite.rs
          git commit -m "test(cli): align KV suite fixture with SmolLM2 tail"
          git push origin HEAD:feature/kv-campaign-suite-verification
