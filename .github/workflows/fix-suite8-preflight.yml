name: Fix suite 8 preflight

on:
  push:
    branches:
      - feat/commercial-acquisition-suite-8

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-8
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/prospect-commercial-advanced/src/mixed_integer.rs')
          s = p.read_text()
          s = s.replace('assert!((solution.values[0] - 1.0).abs() < 1e-8);\n        assert!((solution.values[1] - 2.0).abs() < 1e-8);\n        assert!((solution.objective_value - 13.0).abs() < 1e-8);', 'assert!(solution.values[0].abs() < 1e-8);\n        assert!((solution.values[1] - 3.5).abs() < 1e-8);\n        assert!((solution.objective_value - 14.0).abs() < 1e-8);', 1)
          p.write_text(s)

          p = Path('crates/prospect-commercial-advanced/src/bounded_linear_program.rs')
          s = p.read_text()
          old = '''    let objective_value = objective_constant
        + problem
            .variables
            .iter()
            .zip(&values)
            .map(|(variable, value)| {
                // Subtract the constant contribution already included above
                // only through reconstruction? No: recompute original-space
                // objective below instead, avoiding transform drift.
                variable.objective_coefficient * value
            })
            .sum::<f64>()
        - objective_constant;
'''
          new = '''    let objective_value = problem
        .variables
        .iter()
        .zip(&values)
        .map(|(variable, value)| variable.objective_coefficient * value)
        .sum::<f64>();
'''
          if old not in s:
              raise SystemExit('bounded LP objective fragment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/prospect-commercial-advanced/src
          git commit -m "fix(commercial): normalize wave-eight preflight"
          git push origin HEAD:feat/commercial-acquisition-suite-8
