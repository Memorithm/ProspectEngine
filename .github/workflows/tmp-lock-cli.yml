name: Temporary CLI lockfile qualification
on:
  push:
    branches: [fix/reproducible-cli-lockfile]
permissions:
  contents: write
concurrency:
  group: prospect-cli-lockfile
  cancel-in-progress: false
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install declared toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Track and enforce dependency lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.gitignore')
          lines = p.read_text().splitlines()
          assert lines.count('Cargo.lock') == 1
          p.write_text('\n'.join(line for line in lines if line != 'Cargo.lock')+'\n')
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          for old,new in (
              ('cargo clippy --workspace --all-targets -- -D warnings', 'cargo clippy --locked --workspace --all-targets -- -D warnings'),
              ('cargo test --workspace', 'cargo test --locked --workspace'),
          ):
              assert s.count(old) == 1
              s = s.replace(old,new,1)
          s += '''
                - name: Reproducible CLI build
                  run: cargo build --locked --release -p prospect-cli --bin prospect
          '''
          p.write_text(s)
          p = Path('docs/CLI.md')
          p.write_text(p.read_text()+'''

          ## Reproducible CLI builds

          The workspace tracks `Cargo.lock` because it ships the `prospect` executable.
          Build a reviewed checkout with:

          ```bash
          cargo +1.89.0 build --locked --release -p prospect-cli --bin prospect
          ```

          CI runs locked Clippy, tests and the release CLI build. A dependency change
          must include its reviewed lockfile update; do not remove `--locked` from
          experiment launchers to make a missing or stale lockfile pass. Earlier
          ProspectEngine revisions without a committed lockfile are not repaired
          retroactively. Campaigns requiring locked verifier builds need an explicit
          successor verifier pin. A reproducible build is not model-execution evidence.
          ''')
          PY
      - name: Generate lockfile with declared compiler
        run: cargo +1.89.0 generate-lockfile
      - name: Qualify locked workspace and release binary
        run: |
          cargo +1.89.0 fmt --all -- --check
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
          cargo +1.89.0 build --locked --release -p prospect-cli --bin prospect
      - name: Commit lockfile and enforcement
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add Cargo.lock .gitignore .github/workflows/ci.yml docs/CLI.md
          git commit -m 'build: track CLI dependencies and enforce locked validation'
          git push origin HEAD:fix/reproducible-cli-lockfile
