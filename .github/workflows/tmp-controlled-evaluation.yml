name: Prepare controlled scenario evaluation
on:
  push:
    branches: [feat/controlled-scenario-evaluation]
    paths: ['.github/workflows/tmp-controlled-evaluation.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install explicit project toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Wire modules into exact reviewed sources and update scope documentation
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          def original(path, expected):
              raw = Path(path).read_bytes()
              actual = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              if actual != expected:
                  raise SystemExit(f'original source drift: {path}')
              return raw.decode('utf-8')

          path = 'crates/prospect-scenario/src/lib.rs'
          source = original(path, 'cd1e92b699295fdb88e589d4b58fc5a26a62e1ea')
          Path(path).write_text(source.replace('#![forbid(unsafe_code)]\n', '#![forbid(unsafe_code)]\n\npub mod controlled;\n', 1))

          path = 'crates/prospect-dispatch/src/execution.rs'
          source = original(path, '8cff6ace43b86a7795731bfdcaf8a46aba3315bb')
          Path(path).write_text('pub mod controlled;\npub use controlled::{RegisteredBatchExecution, evaluate_registered_bundle_controlled};\n\n' + source)

          path = Path('crates/prospect-dispatch/src/execution/controlled.rs')
          source = path.read_text()
          assert source.count('use prospect_core::{Scenario, ScenarioId};') == 1
          path.write_text(source.replace('use prospect_core::{Scenario, ScenarioId};', 'use prospect_core::Scenario;'))

          path = Path('crates/prospect-scenario/src/controlled/tests.rs')
          source = path.read_text()
          source = source.replace('BatchStatus::EngineFailed { scenario: None, error: &"baseline failed" }', 'BatchStatus::EngineFailed { scenario: None, error } if *error == "baseline failed"')
          source = source.replace('BatchStatus::EngineFailed { error: &"actual engine failure", .. }', 'BatchStatus::EngineFailed { error, .. } if *error == "actual engine failure"')
          path.write_text(source)

          path = 'README.md'
          source = original(path, '68072a329bd3519fb3c590449d14bddded695203')
          anchor = '## Validate and build'
          assert source.count(anchor) == 1
          addition = '''## Controlled campaign evaluation

          `prospect_scenario::controlled::evaluate_batch_controlled` adds an explicit
          candidate quota, shared cancellation signal, monotonic deadline checkpoints
          and synchronous progress notifications. It preserves successful work, the
          actual failed candidate/error and never-started input separately. Only a
          completed report converts to the existing rankable `BatchResult`.

          `prospect_dispatch::execution::evaluate_registered_bundle_controlled`
          reuses full typed requirement resolution before engine calls. This new API
          is evaluation-only: it does not invoke metrics/policies or rank a prefix.
          The original batch and full bundle-execution APIs remain unchanged.
          See [controlled evaluation](docs/CONTROLLED-EVALUATION.md) for runnable
          examples, terminal states and cooperative-control limitations. Persistent
          checkpoints, automatic retry and GPU/domain validation are separate work.

          '''
          import textwrap
          addition = textwrap.dedent(addition)
          # Triple-quoted first line is already unindented; normalize the body only.
          addition = addition.replace('\n          ', '\n')
          Path(path).write_text(source.replace(anchor, addition + anchor))

          path = 'docs/NEXT_MILESTONE.md'
          source = original(path, '2177b760d3d1120c55f831be19678b4beb4526a9')
          start = source.index('## Current engineering slice: bounded verification inputs')
          end = source.index('## Next empirical slice: exact R2 CUDA qualification')
          replacement = '''## Completed input-boundary foundation

          ProspectEngine #44 is merged at `fc69820e6e50f3b8e9d4a9e5a3565337d3ce598c`.
          Every file-based CLI input now uses an exact-byte shared read budget: 16 MiB
          per file and 128 MiB cumulative, with a 1,024-entry generic campaign cap.
          Whole-suite rereads share the same budget. See
          [input limits](VERIFICATION-INPUT-LIMITS.md). These limits are not parser,
          process-RSS, child-output or hard I/O-deadline limits. Historical pinned
          verifiers still execute their historical code.

          ## Current engineering slice: controlled scenario evaluation

          Add cooperative control to the existing generic and registered typed engine
          boundaries. Preserve successful baseline/candidate work on interruption or
          failure; identify the failed candidate separately from never-started input.
          Resolve all typed bundle requirements before any engine call. Reject
          duplicate direct-batch IDs and prevent incomplete reports from entering the
          existing rankable BatchResult path. The new registered API evaluates only;
          it does not automatically score or select a policy winner.

          Acceptance requires Rust 1.89 formatting, locked workspace Clippy/tests,
          executable examples and the existing R2 producer/consumer/publication
          integration. Regression coverage must include a control request after the
          last successful call, not just before the next candidate. Deadlines and
          cancellation are checkpoints, not preemption or physical rollback.
          See [controlled evaluation](CONTROLLED-EVALUATION.md).

          Persistent evidence/checkpoints, run-bound input identities, safe restart
          and explicit retry/idempotency rules are the next distinct functional
          slice. An in-memory partial report is not a durable resumable experiment.
          Existing evaluate_batch and execute_registered_bundle are not rewritten.

          '''
          replacement = replacement.replace('\n          ', '\n')
          Path(path).write_text(source[:start] + replacement + source[end:])
          PY
      - name: Format and validate all actual source changes
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
          cargo +1.89.0 run --locked -p prospect-scenario --example controlled_evaluation
          cargo +1.89.0 build --locked --release -p prospect-cli --bin prospect
      - name: Commit validated source and remove one-use workflow
        run: |
          git rm .github/workflows/tmp-controlled-evaluation.yml
          git add crates/prospect-scenario/src/lib.rs crates/prospect-scenario/src/controlled.rs crates/prospect-scenario/src/controlled/tests.rs crates/prospect-scenario/examples/controlled_evaluation.rs
          git add crates/prospect-dispatch/src/execution.rs crates/prospect-dispatch/src/execution/controlled.rs crates/prospect-dispatch/src/execution/controlled/tests.rs
          git add docs/CONTROLLED-EVALUATION.md docs/NEXT_MILESTONE.md README.md
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat: integrate and qualify controlled typed scenario evaluation'
          git push origin HEAD:refs/heads/feat/controlled-scenario-evaluation
