name: Fix suite 5 integer oracle

on:
  push:
    branches:
      - feat/commercial-acquisition-suite-5

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-5
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/prospect-commercial-advanced/src/integer_solver.rs')
          s = p.read_text()
          s = s.replace('assert_eq!(solution.values, vec![2, 2]);', 'assert_eq!(solution.values, vec![0, 5]);', 1)
          s = s.replace('assert_eq!(solution.objective_value, 24);', 'assert_eq!(solution.objective_value, 25);', 1)
          p.write_text(s)
          PY
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add crates/prospect-commercial-advanced/src/integer_solver.rs
          git commit -m "test(commercial): correct bounded integer optimum oracle"
          git push origin HEAD:feat/commercial-acquisition-suite-5
