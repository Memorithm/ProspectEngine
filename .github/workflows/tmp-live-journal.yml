name: Prepare live execution journal
on:
  push:
    branches: [feat/live-execution-journal]
    paths: ['.github/workflows/tmp-live-journal.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install explicit project toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Integrate against checked source boundaries
        run: |
          python3 -m py_compile scripts/tmp_prepare_live_journal.py scripts/check_execution_journal.py
          python3 scripts/tmp_prepare_live_journal.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/prospect-dispatch/src/execution/record/journal/tests.rs')
          source = p.read_text()
          start = source.index('impl Default for Memory {')
          end = source.index('impl Memory {', start)
          source = source[:start] + source[end:]
          assert source.count('struct Memory {') == 1
          p.write_text(source.replace('struct Memory {', '#[derive(Default)]\nstruct Memory {', 1))
          PY
      - name: Validate integrated Rust source and all existing contracts
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
          cargo +1.89.0 build --locked --release -p prospect-cli --bin prospect --example journal_fixture
          python3 scripts/check_execution_journal.py \
            --prospect target/release/prospect \
            --fixture target/release/examples/journal_fixture \
            --revision "$(git rev-parse HEAD)"
          git diff --check
      - name: Commit validated source without workflow modifications
        run: |
          # Workflow edits are performed separately by the repository connector.
          # Keep this token restricted to ordinary source content changes.
          git restore .github/workflows/ci.yml
          git rm scripts/tmp_prepare_live_journal.py
          git add crates/prospect-dispatch/src/execution/record.rs crates/prospect-dispatch/src/execution/record/journal.rs crates/prospect-dispatch/src/execution/record/journal
          git add crates/prospect-cli/src crates/prospect-cli/examples/journal_fixture.rs crates/prospect-cli/tests/execution_journals.rs crates/prospect-cli/Cargo.toml
          git add Cargo.lock README.md docs/CLI.md docs/NEXT_MILESTONE.md
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat: integrate live execution journaling and conservative recovery inspection'
          git push origin HEAD:refs/heads/feat/live-execution-journal
