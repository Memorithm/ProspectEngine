name: Temporary PR 32 rustfmt

on:
  push:
    branches:
      - feature/typed-bundle-execution-registry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/typed-bundle-execution-registry
      - name: Install Rust 1.89 with rustfmt
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Format workspace
        run: |
          rustup default 1.89.0
          cargo fmt --all
      - name: Commit formatting when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add --all
          git commit -m "style(dispatch): apply rustfmt to typed execution"
          git push origin HEAD:feature/typed-bundle-execution-registry
