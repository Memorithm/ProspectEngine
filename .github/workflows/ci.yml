name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust 1.89
        run: rustup default 1.89.0

      - name: Formatting
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/rustfmt-check.log"
          status=$?
          cargo fmt --all
          git diff --binary -- . > "$RUNNER_TEMP/rustfmt.patch"
          exit "$status"

      - name: Upload rustfmt diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rustfmt-check.log
            ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: ignore
          retention-days: 3

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
