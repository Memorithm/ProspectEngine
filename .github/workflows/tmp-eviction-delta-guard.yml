name: Reproduce eviction metric overflow and validate repair
on:
  push:
    branches: [fix/eviction-observed-delta-guard]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install project toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - name: Add regressions to the exact reviewed source
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('crates/prospect-kv-observed/src/lib.rs')
          raw = path.read_bytes()
          blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          assert blob == '8d4fd21dde2124f633c1e9a942dc368352ea2437', blob
          source = raw.decode()
          anchor = '    #[test]\n    fn parses_observed_record_and_preserves_metric_semantics()'
          assert source.count(anchor) == 1
          tests = '''    #[test]
              fn eviction_delta_guard_rejects_overflow_through_public_parser() {
                  for (baseline, candidate) in [(-1.0e308_f64, 1.0e308_f64), (1.0e308_f64, -1.0e308_f64)] {
                      assert!(baseline.is_finite() && candidate.is_finite());
                      assert!(!(candidate - baseline).is_finite());
                      let mut value: Value = serde_json::from_str(&record_json(3, '3', 0.78)).unwrap();
                      value["metrics"][1]["baseline_value"] = json!(baseline);
                      value["metrics"][1]["candidate_value"] = json!(candidate);
                      value["metrics"][1]["delta"] = json!(0.0);
                      let result = KvlabKvRealModelEvictionEvidenceV1::from_canonical_json(&recanonicalize(&value));
                      assert!(matches!(result, Err(super::KvlabKvRealModelEvidenceError::MetricDeltaMismatch(_))), "overflow admitted: {result:?}");
                  }
              }

              #[test]
              fn eviction_delta_guard_rejects_nonfinite_comparator_operands() {
                  for invalid in [f64::INFINITY, f64::NEG_INFINITY, f64::NAN] {
                      for finite in [0.0, 1.0, -1.0, 1.0e308] {
                          assert!(!super::nearly_equal(finite, invalid));
                          assert!(!super::nearly_equal(invalid, finite));
                      }
                      assert!(!super::nearly_equal(invalid, invalid));
                  }
              }

              #[test]
              fn eviction_delta_guard_preserves_large_finite_public_records() {
                  for (baseline, candidate) in [(1.0e307_f64, 2.0e307_f64), (-2.0e307_f64, -1.0e307_f64)] {
                      let mut value: Value = serde_json::from_str(&record_json(3, '3', 0.78)).unwrap();
                      value["metrics"][1]["baseline_value"] = json!(baseline);
                      value["metrics"][1]["candidate_value"] = json!(candidate);
                      value["metrics"][1]["delta"] = json!(candidate - baseline);
                      assert!(KvlabKvRealModelEvictionEvidenceV1::from_canonical_json(&recanonicalize(&value)).is_ok());
                  }
              }

              #[test]
              fn eviction_delta_guard_preserves_finite_tolerances() {
                  assert!(super::nearly_equal(0.0, 5.0e-13));
                  assert!(super::nearly_equal(1.0e6, 1.0e6 + 5.0e-7));
                  assert!(super::nearly_equal(-0.0, 0.0));
                  assert!(!super::nearly_equal(0.0, 1.0e-6));
                  assert!(!super::nearly_equal(1.0e6, 1.0e6 + 1.0));
                  assert!(!super::nearly_equal(f64::MAX, -f64::MAX));
              }

          '''
          path.write_text(source.replace(anchor, tests + anchor))
          PY
      - name: Require both rejection regressions to fail on original implementation
        run: |
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(['cargo', '+1.89.0', 'test', '--locked', '-p', 'prospect-kv-observed', 'eviction_delta_guard_rejects', '--', '--nocapture'], text=True, capture_output=True)
          print(result.stdout)
          print(result.stderr)
          assert result.returncode == 101, result.returncode
          assert 'test result: FAILED. 0 passed; 2 failed;' in result.stdout
          assert 'eviction_delta_guard_rejects_overflow_through_public_parser ... FAILED' in result.stdout
          assert 'eviction_delta_guard_rejects_nonfinite_comparator_operands ... FAILED' in result.stdout
          PY
      - name: Apply finite guard and test repaired crate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/prospect-kv-observed/src/lib.rs')
          source = path.read_text()
          anchor = 'fn nearly_equal(left: f64, right: f64) -> bool {\n'
          assert source.count(anchor) == 1
          guard = ('    // Finite stored endpoints can produce an infinite derived delta.\n'
                   '    // Reject it before tolerance arithmetic can compare infinity <= infinity.\n'
                   '    if !left.is_finite() || !right.is_finite() {\n'
                   '        return false;\n'
                   '    }\n')
          path.write_text(source.replace(anchor, anchor + guard))
          PY
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked -p prospect-kv-observed --all-targets -- -D warnings
          cargo +1.89.0 test --locked -p prospect-kv-observed
      - name: Commit validated source and remove preparation workflow
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add crates/prospect-kv-observed/src/lib.rs
          git rm .github/workflows/tmp-eviction-delta-guard.yml
          git commit -m 'fix(kv-observed): reject overflowing eviction metric deltas'
          git push origin HEAD:fix/eviction-observed-delta-guard
