name: Harden constrained evidence canonicalization
on:
  push:
    branches:
      - feat/constrained-decision-evidence-v2
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Apply recursive JSON canonicalization
        run: python3 .github/scripts/fix_pr51_canonical.py
      - name: Validate canonical evidence fix
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit source-only fix
        run: |
          git rm -f .github/workflows/tmp-fix-pr51-canonical.yml .github/scripts/fix_pr51_canonical.py
          git add crates/prospect-evidence/src/constrained.rs
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'fix(evidence): canonicalize nested application payloads'
          git push origin HEAD:refs/heads/feat/constrained-decision-evidence-v2
