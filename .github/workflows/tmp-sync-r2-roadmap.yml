name: Synchronize R2 roadmap status
on:
  push:
    branches: [test/r2-publication-gate-integration]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Correct stale roadmap language without deleting contract history
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('docs/ROADMAP.md')
          raw = path.read_bytes()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == '4df80dd413c2d469796695edbead6d04df2461d2'
          text = raw.decode()
          title = '# ProspectEngine Roadmap\n'
          assert text.startswith(title)
          notice = ('\n## Current execution/publication milestone — 2026-09-15\n\n'
                    'The bootstrap, evidence model, ElasticXxx bridge and plugin boundary are implemented. '
                    'The active engineering slice is mandatory R2 global verification before publication, '
                    'with separate immutable per-campaign/global verifier pins and regression tests. '
                    'See [NEXT_MILESTONE.md](NEXT_MILESTONE.md) for current acceptance criteria and '
                    '[R2-SUITE-READINESS.md](R2-SUITE-READINESS.md) for actual-build and synthetic-publication checks. '
                    'No new CUDA or representative model-quality result is established by this documentation update.\n')
          text = title + notice + text[len(title):]
          start = 'NNIS revision `58e7db8e1c4b471a7fe82a4beba11904240c4e89` now fails closed'
          end = '\n\nObserved real-model eviction evidence uses'
          assert text.count(start) == 1 and text.count(end) == 1
          left = text.index(start)
          right = text.index(end, left)
          replacement = ('Historical R1 input checks established trace, position and logical-byte consistency only. '
              'NNIS `58e7db8e1c4b471a7fe82a4beba11904240c4e89` checked the F32 KV geometry but preserved BF16 '
              'source weights before an F32-only decoder; the R1 pinned verifier also lacked the lockfile '
              'requested by its launcher. Those input checks did not establish executable end-to-end readiness. '
              'R1 inputs and historical revisions remain unchanged.\n\n'
              'R2 inputs are frozen at KVLab `216b49ae4d62ed4c4c2edfd1e88f929d0a0fd9e5`, with repaired '
              'NNIS runtime `091aabbb3e132627cf64716720aae530442d2a32`. The existing per-campaign verifier is '
              'ProspectEngine `298acdc91682ef1d09914b6f964e8934828825c0`; the separately pinned global publication '
              'verifier is `ca9685cd98f3a0a23e8c4f7e368736bb3aa28d0c`. The R2 whole-suite consumer checks exact '
              'frozen inputs, published summaries, policy budgets and common baseline identity. KVLab #100 '
              'places that global check before the final publication rename and emits a separate '
              'stage-consistency receipt without changing the v1 manifest or file set. Final-head CI and '
              'actual producer/consumer checks remain required; defining the workflow does not imply it passed.\n\n'
              'Finite-operand guards protect the shared KVLab metric path (#97), the position-native Rust '
              'consumer (#41) and the separate legacy eviction consumer (#42). They reject overflowing '
              'derived deltas without changing finite tolerances. These integrity repairs and synthetic '
              'fixtures do not provide observed GPU evidence. The real-model numerical/quality, '
              'representative comparison and benchmark-claim gates above remain open.')
          text = text[:left] + replacement + text[right:]
          text = text.replace('## Milestone 0.2 — evidence model\n', '## Milestone 0.2 — evidence model — complete\n')
          text = text.replace('## Milestone 0.5 — plugin boundary\n', '## Milestone 0.5 — plugin boundary — complete\n')
          path.write_text(text)
          PY
          git diff --check
      - name: Commit documentation and remove helper
        run: |
          git config user.name 'MEMOPERF'
          git config user.email 'contact@checkupauto.fr'
          git add docs/ROADMAP.md
          git rm .github/workflows/tmp-sync-r2-roadmap.yml
          git commit -m 'docs: synchronize R1/R2 readiness and publication gates'
          git push origin HEAD:test/r2-publication-gate-integration
