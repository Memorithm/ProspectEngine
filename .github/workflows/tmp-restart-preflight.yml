name: Prepare external restart preflight
on:
  push:
    branches: [feat/externally-bound-restart-preflight]
    paths: ['.github/workflows/tmp-restart-preflight.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install explicit toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Wire additive API and command against reviewed source identities
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def original(path, sha):
              raw = Path(path).read_bytes()
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest() == sha, path
              return raw.decode()
          def change(path, sha, old, new):
              source = original(path, sha)
              assert source.count(old) == 1, (path, old)
              Path(path).write_text(source.replace(old, new))
          change('crates/prospect-dispatch/src/execution/record/journal.rs',
                 '769c8d5c88dbb92d569232cf3ac6e9241d20bd29', 'mod evaluation;',
                 'pub mod recovery;\n\nmod evaluation;')
          change('crates/prospect-cli/src/lib.rs', 'c89db398af046a7afeb321b2fad65f5b79139121',
                 'pub mod input;', 'pub mod input;\npub mod execution_restart;')
          path = 'crates/prospect-cli/src/main.rs'
          source = original(path, '6012cf549450f3dd0841c139a8cfeae31c29fc08')
          source = source.replace('Usage:\\n', 'Usage:\\n  prospect preflight-execution-restart <journal.jsonl> <bundle.json> <trusted-expectations.json> <implementation-artifact>\\n', 1)
          anchor = '        Some("list-adapters") => {'
          assert source.count(anchor) == 1
          command = '''        Some("preflight-execution-restart") => {
              let paths = arguments.by_ref().take(5).collect::<Vec<_>>();
              let [journal, bundle, expectations, artifact]: [OsString; 4] = paths.try_into()
                  .map_err(|_| CliError::Usage("preflight-execution-restart requires exactly four file paths".into()))?;
              let summary = prospect_cli::execution_restart::preflight_execution_restart_files(
                  journal, bundle, expectations, artifact,
              ).map_err(|error| CliError::Verification(error.to_string()))?;
              serde_json::to_string(&summary).map_err(|error| CliError::Verification(error.to_string()))
          }
          '''
          Path(path).write_text(source.replace(anchor, command + anchor))
          path = 'crates/prospect-cli/examples/journal_fixture.rs'
          source = original(path, '25b8fe63b6eeec6268619a05ae1c30a1a4b8a436')
          source = source.replace('[--exit-during-second|--fail-second]', '[--exit-during-second|--fail-second|--quota-one]')
          source = source.replace('["", "--exit-during-second", "--fail-second"]', '["", "--exit-during-second", "--fail-second", "--quota-one"]')
          assert source.count('&EvaluationControl::new(3)') == 1
          source = source.replace('&EvaluationControl::new(3)', '&EvaluationControl::new(if mode == "--quota-one" { 1 } else { 3 })')
          Path(path).write_text(source)
          path = Path('crates/prospect-dispatch/src/execution/record/journal/recovery.rs')
          source = path.read_text()
          anchor = '    validate_sha256(actual_artifact_sha256)?;'
          assert source.count(anchor) == 1
          source = source.replace(anchor, '''    if journal.len() > super::MAX_JOURNAL_BYTES || expected_bundle.len() > super::super::MAX_RECORD_BYTES {
              return invalid("restart journal or input exceeds byte limit");
          }
          ''' + anchor)
          path.write_text(source)
          path = Path('crates/prospect-dispatch/src/execution/record/journal/recovery/tests.rs')
          source = path.read_text()
          source = source.replace('    let mutations: Vec<Box<dyn Fn(&mut Value)>> = vec![',
              '    type Mutation = Box<dyn Fn(&mut Value)>;\n    let mutations: Vec<Mutation> = vec![')
          source = source.replace('    let altered = journal.replace("\\\"12\\\"", "\\\"99\\\"");',
              '''    let mut changed = successes(2);
          if let Event::CallSucceeded { payload, .. } = changed.last_mut().unwrap() { *payload = "99".into(); }
          let altered = log(changed, 3);
          assert!(inspect_execution_journal(&altered, &input()).is_ok());''')
          path.write_text(source)
          path = 'README.md'
          source = original(path, '1afc9b20eaa2ab988dfaa58cddffc5743ec0b6be')
          anchor = '## Validate and build'
          assert source.count(anchor) == 1
          addition = '## Externally bound restart preflight\n\nThe read-only `prospect preflight-execution-restart` command compares live journals\nto independently retained input/run/adapter/implementation/codec expectations and\nhashes the separately supplied implementation artifact without executing it. It\nidentifies never-started candidates but blocks unknown outcomes, failed calls, torn\nlogs and stateful/effectful engines. A positive preparation result still sets\n`resume_authorized=false`; typed restoration and actual continuation remain separate.\nSee [restart preflight](docs/RESTART-PREFLIGHT.md) for the trust contract and limits.\n\n'
          Path(path).write_text(source.replace(anchor, addition + anchor))
          path = 'docs/NEXT_MILESTONE.md'
          source = original(path, 'c74d2a1a39d4843b577cf5acdf93b20213169af3')
          start = source.index('## Current engineering slice: live execution journaling')
          end = source.index('## Next empirical slice: exact R2 CUDA qualification')
          replacement = '## Completed live-journal foundation\n\nProspectEngine #47 is merged at `3a48d4e12d4c2c1bfa0ed8fa4174d069b65e20a5`.\nCall intentions are acknowledged before invocation and actual returns afterward.\nStorage/encoding failures preserve in-memory work and block further domain calls.\nThe bounded inspector reports unknown outcomes and never authorizes replay.\nSee [live journals](LIVE-EXECUTION-JOURNAL.md).\n\n## Current engineering slice: external restart admission\n\nCompare journal/input/run/adapter/implementation/codec identities against a separate\ntrusted expectations contract and stream-hash the actual supplied artifact. Identify\nonly never-started candidates. Unknown outcomes, torn tails, failures, already-complete\nruns and stateful/effectful contracts block continuation preparation.\nAll results retain `resume_authorized=false`; no replay or mutation is performed.\nSee [restart preflight](RESTART-PREFLIGHT.md).\n\nAcceptance requires final-head Rust CI, actual-file/process-exit preflight tests,\nidentity/substitution/size/arity failures and unchanged R2 interoperability. A\nself-consistent log and an expectation derived from that log are not independent\nattestation. The harness uses controlled software fixtures, not models.\n\nThe next functional slice must restore typed values under explicit codec semantics,\nlink a new run to its parent, and execute only approved never-started work. Unknown\neffects need reconciliation; no reader currently reconstructs a rankable full batch\nor implements exactly-once actuation or automatic stateful resume.\n\n'
          Path(path).write_text(source[:start] + replacement + source[end:])
          PY
      - name: Validate all source and actual process/filesystem cases
        run: |
          python3 -m py_compile scripts/check_restart_preflight.py
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
          cargo +1.89.0 build --locked --release -p prospect-cli --bin prospect --example journal_fixture
          python3 scripts/check_execution_journal.py --prospect target/release/prospect --fixture target/release/examples/journal_fixture --revision "$(git rev-parse HEAD)"
          python3 scripts/check_restart_preflight.py --prospect target/release/prospect --fixture target/release/examples/journal_fixture --revision "$(git rev-parse HEAD)"
      - name: Commit only validated source and docs (workflow removed separately)
        run: |
          git add crates/prospect-dispatch/src/execution/record/journal.rs crates/prospect-dispatch/src/execution/record/journal/recovery.rs crates/prospect-dispatch/src/execution/record/journal/recovery/tests.rs
          git add crates/prospect-cli/src/lib.rs crates/prospect-cli/src/main.rs crates/prospect-cli/src/execution_restart.rs crates/prospect-cli/examples/journal_fixture.rs
          git add README.md docs/NEXT_MILESTONE.md
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat: integrate and qualify externally bound restart preflight'
          git push origin HEAD:refs/heads/feat/externally-bound-restart-preflight
