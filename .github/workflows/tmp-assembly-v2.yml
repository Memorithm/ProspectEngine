name: Prepare verified continuation assembly v2
on:
  push:
    branches:
      - feat/verified-continuation-assembly-v2
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Import qualified assembly source and wire fresh base
        run: |
          git fetch origin feat/verified-continuation-assembly:refs/remotes/origin/feat/verified-continuation-assembly
          mkdir -p crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly
          git show origin/feat/verified-continuation-assembly:crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly.rs > crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly.rs
          git show origin/feat/verified-continuation-assembly:crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly/tests.rs > crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly/tests.rs
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/prospect-dispatch/src/execution/record/journal/recovery/continuation.rs')
          s = p.read_text()
          anchor = 'use prospect_bundle::ScenarioBundle;'
          if s.count(anchor) != 1 or 'pub mod assembly;' in s:
              raise SystemExit('continuation module anchor drift')
          p.write_text(s.replace(anchor, 'pub mod assembly;\n\n' + anchor, 1))

          p = Path('crates/prospect-scenario/src/lib.rs')
          s = p.read_text()
          out_anchor = '''impl<I, S> ScenarioOutcome<I, S> {\n    #[must_use]\n    pub const fn scenario(&self) -> &Scenario<I> {'''
          out_replace = '''impl<I, S> ScenarioOutcome<I, S> {\n    /// Construct one structural scenario/signature pair from already validated parts.\n    ///\n    /// This constructor performs no scientific, provenance, or execution check.\n    /// Persistence assemblers must establish those guarantees before calling it.\n    #[must_use]\n    pub const fn from_parts(scenario: Scenario<I>, signature: S) -> Self {\n        Self { scenario, signature }\n    }\n\n    #[must_use]\n    pub const fn scenario(&self) -> &Scenario<I> {'''
          if s.count(out_anchor) != 1:
              raise SystemExit('ScenarioOutcome anchor drift')
          s = s.replace(out_anchor, out_replace, 1)
          batch_anchor = '''impl<I, S> BatchResult<I, S> {\n    #[must_use]\n    pub const fn baseline(&self) -> &S {'''
          batch_replace = '''impl<I, S> BatchResult<I, S> {\n    /// Construct a structural complete-batch container from already validated parts.\n    ///\n    /// No completeness, uniqueness, provenance, metric, or execution validation is\n    /// implied. Verified assemblers must establish those properties before use.\n    #[must_use]\n    pub fn from_parts(baseline: S, outcomes: Vec<ScenarioOutcome<I, S>>) -> Self {\n        Self { baseline, outcomes }\n    }\n\n    #[must_use]\n    pub const fn baseline(&self) -> &S {'''
          if s.count(batch_anchor) != 1:
              raise SystemExit('BatchResult anchor drift')
          p.write_text(s.replace(batch_anchor, batch_replace, 1))

          p = Path('docs/TYPED-CONTINUATION.md')
          s = p.read_text()
          old = '''`ContinuationRunState` distinguishes `Completed`, `Interrupted`, `EngineFailed`,\n`JournalFailed`, and `Rejected`. A completed child means the admitted suffix ran to\ncompletion under the cooperative control and its terminal child-journal entry was\nacknowledged. It does not by itself authenticate hardware or establish scientific\nvalidity.'''
          new = '''`ContinuationRunState` distinguishes `Completed`, `Interrupted`, `EngineFailed`,\nand `JournalFailed`. Preparation/admission rejection is returned as an error before\na child run state exists; it is not a `ContinuationRunState` variant. A completed\nchild means the admitted suffix ran to completion under the cooperative control and\nits terminal child-journal entry was acknowledged. It does not by itself authenticate\nhardware or establish scientific validity.'''
          if s.count(old) != 1:
              raise SystemExit('typed continuation documentation anchor drift')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate fresh-base assembly and entire workspace
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit validated source only
        run: |
          git rm -f .github/workflows/tmp-assembly-v2.yml
          git add crates/prospect-scenario/src/lib.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/assembly/tests.rs
          git add docs/TYPED-CONTINUATION.md
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'feat(recovery): assemble verified continuation chains'
          git push origin HEAD:refs/heads/feat/verified-continuation-assembly-v2
