name: Harden typed continuation review findings
on:
  push:
    branches:
      - feat/typed-continuation-run
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Apply review hardening
        run: python3 .ci/tmp_fix_pr50_review.py
      - name: Validate exact hardening
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.89.0 test --locked --workspace
      - name: Commit source-only fix
        run: |
          git rm -f .github/workflows/tmp-fix-pr50-review.yml .ci/tmp_fix_pr50_review.py
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation.rs
          git add crates/prospect-dispatch/src/execution/record/journal/recovery/continuation/tests.rs
          git -c user.name='MEMOPERF' -c user.email='contact@checkupauto.fr' commit -m 'fix(recovery): bind child lifecycle to proven parent state'
          git push origin HEAD:refs/heads/feat/typed-continuation-run
