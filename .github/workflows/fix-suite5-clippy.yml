name: Fix commercial acquisition suite 5 clippy

on:
  push:
    branches: [feat/commercial-acquisition-suite-5]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-5

      - name: Apply exact strict-lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/prospect-commercial-advanced/src/constraint_propagation.rs')
          s = p.read_text()
          old = '            let coefficient = coefficients[position];\n'
          if old not in s:
              raise SystemExit('unused coefficient fragment not found')
          p.write_text(s.replace(old, '', 1))

          p = Path('crates/prospect-commercial-advanced/src/forecast_advanced.rs')
          s = p.read_text()
          old_additive = '''        if let Ok(additive) = HoltWintersAdditiveModel::fit(
            train,
            HoltWintersConfig {
                alpha: 0.35,
                beta: 0.1,
                gamma: 0.2,
                season_length,
            },
        ) {
            if let Ok(forecast) = additive.forecast(holdout_len) {
                candidates.push((ForecastFamily::AdditiveSeasonal, forecast));
            }
        }
'''
          new_additive = '''        if let Ok(additive) = HoltWintersAdditiveModel::fit(
            train,
            HoltWintersConfig {
                alpha: 0.35,
                beta: 0.1,
                gamma: 0.2,
                season_length,
            },
        ) && let Ok(forecast) = additive.forecast(holdout_len)
        {
            candidates.push((ForecastFamily::AdditiveSeasonal, forecast));
        }
'''
          old_multiplicative = '''        if train.iter().all(|value| *value > 0.0) {
            if let Ok(multiplicative) = HoltWintersMultiplicativeModel::fit(
                train,
                MultiplicativeHoltWintersConfig {
                    alpha: 0.35,
                    beta: 0.1,
                    gamma: 0.2,
                    phi: 0.95,
                    season_length,
                },
            ) {
                if let Ok(forecast) = multiplicative.forecast(holdout_len) {
                    candidates.push((ForecastFamily::MultiplicativeSeasonal, forecast));
                }
            }
        }
'''
          new_multiplicative = '''        if train.iter().all(|value| *value > 0.0)
            && let Ok(multiplicative) = HoltWintersMultiplicativeModel::fit(
                train,
                MultiplicativeHoltWintersConfig {
                    alpha: 0.35,
                    beta: 0.1,
                    gamma: 0.2,
                    phi: 0.95,
                    season_length,
                },
            )
            && let Ok(forecast) = multiplicative.forecast(holdout_len)
        {
            candidates.push((ForecastFamily::MultiplicativeSeasonal, forecast));
        }
'''
          if old_additive not in s:
              raise SystemExit('additive forecast fragment not found')
          s = s.replace(old_additive, new_additive, 1)
          if old_multiplicative not in s:
              raise SystemExit('multiplicative forecast fragment not found')
          p.write_text(s.replace(old_multiplicative, new_multiplicative, 1))
          PY
          cargo fmt --all
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/prospect-commercial-advanced/src/constraint_propagation.rs crates/prospect-commercial-advanced/src/forecast_advanced.rs
          git commit -m "fix(commercial): satisfy strict wave-five lints"
          git push origin HEAD:feat/commercial-acquisition-suite-5
