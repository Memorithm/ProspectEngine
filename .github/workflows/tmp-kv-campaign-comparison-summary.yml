name: Temporary KV campaign comparison summary

on:
  push:
    branches:
      - feature/kv-campaign-comparison-summary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/kv-campaign-comparison-summary
      - name: Install Rust 1.89
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Patch comparison summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("crates/prospect-cli/src/lib.rs")
          s = p.read_text()
          if "CampaignPolicyObservationSummary" not in s:
              s = s.replace("#[derive(Clone, Debug, PartialEq, Eq, Serialize)]\npub struct CampaignVerificationSummary {", "#[derive(Clone, Debug, PartialEq, Serialize)]\npub struct CampaignVerificationSummary {", 1)
              s = s.replace("    policies: Vec<String>,\n    record_count: usize,", "    policies: Vec<String>,\n    observations: Vec<CampaignPolicyObservationSummary>,\n    record_count: usize,", 1)
              enum_marker = "#[derive(Debug)]\npub enum CampaignDirectoryError {"
              structs = "\n".join([
                  "#[derive(Clone, Debug, PartialEq, Serialize)]",
                  "pub struct CampaignMetricObservationSummary {",
                  "    name: String,",
                  "    kind: String,",
                  "    unit: String,",
                  "    preference: String,",
                  "    baseline_value: f64,",
                  "    candidate_value: f64,",
                  "    delta: f64,",
                  "}",
                  "",
                  "#[derive(Clone, Debug, PartialEq, Serialize)]",
                  "pub struct CampaignPolicyObservationSummary {",
                  "    policy: String,",
                  "    retained_positions: Vec<usize>,",
                  "    logical_retained_bytes: u64,",
                  "    logical_evicted_bytes: u64,",
                  "    metrics: Vec<CampaignMetricObservationSummary>,",
                  "}",
                  "",
              ])
              assert enum_marker in s
              s = s.replace(enum_marker, structs + enum_marker, 1)

              count_marker = "    #[must_use]\n    pub const fn record_count(&self) -> usize {\n        self.record_count\n    }"
              count_replacement = "    #[must_use]\n    pub fn observations(&self) -> &[CampaignPolicyObservationSummary] {\n        &self.observations\n    }\n\n" + count_marker
              assert count_marker in s
              s = s.replace(count_marker, count_replacement, 1)

              verify_marker = "pub fn verify_kv_campaign_directory("
              impls = "\n".join([
                  "impl CampaignPolicyObservationSummary {",
                  "    #[must_use]",
                  "    pub fn policy(&self) -> &str { &self.policy }",
                  "    #[must_use]",
                  "    pub fn retained_positions(&self) -> &[usize] { &self.retained_positions }",
                  "    #[must_use]",
                  "    pub const fn logical_retained_bytes(&self) -> u64 { self.logical_retained_bytes }",
                  "    #[must_use]",
                  "    pub const fn logical_evicted_bytes(&self) -> u64 { self.logical_evicted_bytes }",
                  "    #[must_use]",
                  "    pub fn metrics(&self) -> &[CampaignMetricObservationSummary] { &self.metrics }",
                  "}",
                  "",
                  "impl CampaignMetricObservationSummary {",
                  "    #[must_use]",
                  "    pub fn name(&self) -> &str { &self.name }",
                  "    #[must_use]",
                  "    pub fn kind(&self) -> &str { &self.kind }",
                  "    #[must_use]",
                  "    pub fn unit(&self) -> &str { &self.unit }",
                  "    #[must_use]",
                  "    pub fn preference(&self) -> &str { &self.preference }",
                  "    #[must_use]",
                  "    pub const fn baseline_value(&self) -> f64 { self.baseline_value }",
                  "    #[must_use]",
                  "    pub const fn candidate_value(&self) -> f64 { self.candidate_value }",
                  "    #[must_use]",
                  "    pub const fn delta(&self) -> f64 { self.delta }",
                  "}",
                  "",
              ])
              assert verify_marker in s
              s = s.replace(verify_marker, impls + verify_marker, 1)

              field_marker = "        policies: verified.policies().to_vec(),\n        record_count: verified.records().len(),"
              observations = "\n".join([
                  "        policies: verified.policies().to_vec(),",
                  "        observations: verified",
                  "            .records()",
                  "            .iter()",
                  "            .map(|record| {",
                  "                let outcome = record.selection().outcome();",
                  "                CampaignPolicyObservationSummary {",
                  "                    policy: outcome.policy().to_owned(),",
                  "                    retained_positions: outcome.retained_positions().to_vec(),",
                  "                    logical_retained_bytes: outcome.logical_retained_bytes(),",
                  "                    logical_evicted_bytes: outcome.logical_evicted_bytes(),",
                  "                    metrics: record.metrics().iter().map(|metric| CampaignMetricObservationSummary {",
                  "                        name: metric.name().to_owned(),",
                  "                        kind: metric.kind().as_str().to_owned(),",
                  "                        unit: metric.unit().to_owned(),",
                  "                        preference: metric.preference().as_str().to_owned(),",
                  "                        baseline_value: metric.baseline_value(),",
                  "                        candidate_value: metric.candidate_value(),",
                  "                        delta: metric.delta(),",
                  "                    }).collect(),",
                  "                }",
                  "            })",
                  "            .collect(),",
                  "        record_count: verified.records().len(),",
              ])
              assert field_marker in s
              s = s.replace(field_marker, observations, 1)

              test_marker = "        assert_eq!(summary.record_count(), 1);\n        assert_eq!(summary.campaign_spec_sha256().len(), 64);"
              test_lines = "\n".join([
                  "        assert_eq!(summary.record_count(), 1);",
                  "        assert_eq!(summary.observations().len(), 1);",
                  "        let observation = &summary.observations()[0];",
                  "        assert_eq!(observation.policy(), \"lru\");",
                  "        assert_eq!(observation.retained_positions(), &[0, 2, 4]);",
                  "        assert_eq!(observation.logical_retained_bytes(), 192);",
                  "        assert_eq!(observation.logical_evicted_bytes(), 128);",
                  "        assert_eq!(observation.metrics().len(), 1);",
                  "        let metric = &observation.metrics()[0];",
                  "        assert_eq!(metric.name(), \"mean_nll\");",
                  "        assert_eq!(metric.kind(), \"quality\");",
                  "        assert_eq!(metric.unit(), \"nat_per_token\");",
                  "        assert_eq!(metric.preference(), \"lower_is_better\");",
                  "        assert_eq!(metric.baseline_value(), 1.0);",
                  "        assert_eq!(metric.candidate_value(), 1.25);",
                  "        assert_eq!(metric.delta(), 0.25);",
                  "        assert_eq!(summary.campaign_spec_sha256().len(), 64);",
              ])
              assert test_marker in s
              s = s.replace(test_marker, test_lines, 1)
              p.write_text(s)

          p = Path("crates/prospect-kv-position-campaign/src/lib.rs")
          s = p.read_text()
          old = 'pub const KVLAB_KV_POSITION_CAMPAIGN_REVISION: &str = "9fb6cae9f644daee7904fd14b50c3995c898fa6d";'
          new = 'pub const KVLAB_KV_POSITION_CAMPAIGN_REVISION: &str = "ffc406abedcaf2b69cd89d804b52c3ebf7cd93ee";'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              assert new in s

          p = Path("docs/CLI.md")
          s = p.read_text()
          old = "A successful verification writes one compact JSON object to stdout containing the campaign-spec SHA-256, reconstructed trace SHA-256, verified policy names, and record count."
          new = "A successful verification writes one compact JSON object to stdout containing the campaign-spec SHA-256, reconstructed trace SHA-256, verified policy names, record count, and one observed summary per policy. Each policy summary contains exact retained positions, logical KV bytes retained/evicted, and every verified metric with its declared kind, unit, preference, baseline value, candidate value, and delta. ProspectEngine does not infer a winner from these values."
          if old in s:
              p.write_text(s.replace(old, new, 1))
          else:
              assert new in s

          p = Path("docs/ROADMAP.md")
          s = p.read_text()
          marker = "Observed real-model eviction evidence uses KVLab schema"
          note = "KVLab position-native campaign directories are now self-contained at merged KVLab revision `ffc406abedcaf2b69cd89d804b52c3ebf7cd93ee`: the canonical campaign specification is persisted atomically with the manifest and observed records. ProspectEngine pins this campaign contract revision and exposes verified per-policy logical byte accounting plus observed metric baseline/candidate/delta values without deriving an automatic scientific ranking. Representative-model and benchmark gates remain open until qualifying executions exist.\n\n"
          if note not in s:
              assert marker in s
              p.write_text(s.replace(marker, note + marker, 1))
          PY
      - name: Format
        run: |
          rustup default 1.89.0
          cargo fmt --all
      - name: Test focused crates
        run: |
          cargo test -p prospect-kv-position-campaign
          cargo test -p prospect-cli
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/prospect-cli/src/lib.rs crates/prospect-kv-position-campaign/src/lib.rs docs/CLI.md docs/ROADMAP.md
          git commit -m "feat(cli): summarize verified KV campaign observations"
          git push origin HEAD:feature/kv-campaign-comparison-summary
