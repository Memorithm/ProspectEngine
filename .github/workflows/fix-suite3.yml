name: Fix commercial acquisition suite lint

on:
  push:
    branches: [feat/commercial-acquisition-suite-3]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/commercial-acquisition-suite-3

      - name: Apply exact lint fix and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/prospect-commercial-advanced/src/learning.rs')
          s = p.read_text()
          old = 'fn Bayesian_decision_and_information_value_are_explicit()'
          new = 'fn bayesian_decision_and_information_value_are_explicit()'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add crates/prospect-commercial-advanced/src/learning.rs
          git commit -m "fix(commercial): satisfy strict Bayesian test lint"
          git push origin HEAD:feat/commercial-acquisition-suite-3
